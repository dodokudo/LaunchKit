<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画像URL化 - LaunchKit</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }
    header {
      padding: 22px 24px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
    .content {
      padding: 24px;
      display: grid;
      gap: 18px;
    }
    .drop {
      border: 2px dashed #b8c4d8;
      border-radius: 12px;
      background: #f8fbff;
      padding: 28px;
      display: grid;
      gap: 12px;
      justify-items: center;
      text-align: center;
    }
    .drop.dragover {
      border-color: #2563eb;
      background: #eff6ff;
    }
    input[type="file"] {
      width: 100%;
      max-width: 420px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px;
      background: #fff;
    }
    .note {
      margin: 0;
      color: #64748b;
      font-size: 13px;
      line-height: 1.7;
    }
    button {
      border: 1px solid #2563eb;
      background: #2563eb;
      color: #fff;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .result {
      display: none;
      border: 1px solid #dbeafe;
      background: #eff6ff;
      border-radius: 12px;
      padding: 16px;
      gap: 12px;
    }
    .result.active {
      display: grid;
    }
    .url-row {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
    }
    input[type="text"] {
      width: 100%;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      color: #0f172a;
      background: #fff;
    }
    .secondary {
      border-color: #cbd5e1;
      background: #fff;
      color: #1e293b;
    }
    .preview {
      max-width: 100%;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      background: #fff;
    }
    .status {
      min-height: 20px;
      color: #0f766e;
      font-size: 13px;
      font-weight: 700;
    }
    .error {
      color: #b91c1c;
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      header { align-items: flex-start; flex-direction: column; }
      .url-row { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>画像を公開URLにする</h1>
      <a href="/admin/">LaunchKit管理画面へ戻る</a>
    </header>
    <div class="content">
      <div class="drop" id="dropZone">
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        <p class="note">PNG / JPG / WebP / GIF 対応。最大10MB。アップロード後に公開URLを発行します。</p>
        <button id="uploadBtn" disabled>URLを発行する</button>
      </div>

      <div class="status" id="status"></div>

      <section class="result" id="result">
        <div class="url-row">
          <input id="urlInput" type="text" readonly>
          <button id="copyBtn" type="button">コピー</button>
          <button id="deployBtn" type="button" class="secondary">本番に反映</button>
          <a id="openLink" class="secondary" href="#" target="_blank" rel="noopener noreferrer" style="border:1px solid #cbd5e1;border-radius:10px;padding:11px 16px;text-align:center;">開く</a>
        </div>
        <img id="previewImage" class="preview" alt="アップロード画像プレビュー">
      </section>
    </div>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const urlInput = document.getElementById('urlInput');
    const copyBtn = document.getElementById('copyBtn');
    const deployBtn = document.getElementById('deployBtn');
    const openLink = document.getElementById('openLink');
    const previewImage = document.getElementById('previewImage');
    const dropZone = document.getElementById('dropZone');

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function selectedFile() {
      return fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
    }

    function validateFile(file) {
      if (!file) return '画像を選択してください';
      if (!['image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(file.type)) {
        return 'PNG / JPG / WebP / GIF の画像を選択してください';
      }
      if (file.size > 10 * 1024 * 1024) {
        return '10MB以下の画像を選択してください';
      }
      return '';
    }

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('file_read_failed'));
        reader.readAsDataURL(file);
      });
    }

    fileInput.addEventListener('change', () => {
      const error = validateFile(selectedFile());
      uploadBtn.disabled = Boolean(error);
      setStatus(error || '');
    });

    uploadBtn.addEventListener('click', async () => {
      const file = selectedFile();
      const error = validateFile(file);
      if (error) {
        setStatus(error, true);
        return;
      }

      uploadBtn.disabled = true;
      setStatus('アップロード中...');
      try {
        const dataUrl = await readAsDataUrl(file);
        const res = await fetch('/api/uploads/images', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, dataUrl }),
        });
        const data = await res.json();
        if (!res.ok || !data.url) {
          throw new Error(data.error || 'upload_failed');
        }

        urlInput.value = data.url;
        openLink.href = data.url;
        previewImage.src = data.url;
        resultEl.classList.add('active');
        setStatus('URLを発行しました');
      } catch (error) {
        console.error(error);
        setStatus('アップロードに失敗しました', true);
      } finally {
        uploadBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (!urlInput.value) return;
      await navigator.clipboard.writeText(urlInput.value);
      setStatus('URLをコピーしました');
    });

    deployBtn.addEventListener('click', async () => {
      deployBtn.disabled = true;
      setStatus('本番に反映中...');
      try {
        const res = await fetch('/api/uploads/deploy', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'deploy_failed');
        }
        setStatus('本番に反映しました。URLを開いて確認できます。', false);
      } catch (error) {
        console.error(error);
        setStatus('本番反映に失敗しました', true);
      } finally {
        deployBtn.disabled = false;
      }
    });

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (event) => {
      const file = event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) return;
      const transfer = new DataTransfer();
      transfer.items.add(file);
      fileInput.files = transfer.files;
      fileInput.dispatchEvent(new Event('change'));
    });
  </script>
</body>
</html>
