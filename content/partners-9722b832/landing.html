<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>パートナー実績ダッシュボード</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e3e5e8;
    --text: #1a1d21;
    --text-sub: #6b7280;
    --accent: #16a34a;
    --gold: #d4a017;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 700; }
  .updated { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-sub); font-size: 12px; font-weight: 600; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tr:last-child td { border-bottom: none; }
  .rank-1 .rank-badge { background: var(--gold); }
  .rank-badge {
    display: inline-block;
    min-width: 24px;
    padding: 2px 6px;
    border-radius: 6px;
    background: #9ca3af;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }
  .agency-name { font-weight: 700; }
  .num { font-variant-numeric: tabular-nums; }
  .empty, .error {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 32px 0;
  }
  .loading { text-align: center; color: var(--text-sub); padding: 48px 0; }
  footer { font-size: 11px; color: var(--text-sub); text-align: center; margin-top: 32px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>パートナー実績ダッシュボード</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div id="content"><div class="loading">読み込み中…</div></div>

  <footer>数値は1日1回更新されます（前日までの実績）</footer>
</div>

<script>
(function () {
  var API_URL = 'https://asto.jp/api/agency/public?token=2fda7e77b1cc9090fc5f2ebd4bf574b9';

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') node.className = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function num(value) {
    var n = Number(value);
    return Number.isFinite(n) ? String(n) : '0';
  }

  function renderRanking(summary) {
    var rows = summary.map(function (s, i) {
      return el('tr', { class: 'rank-' + (i + 1) }, [
        el('td', null, [el('span', { class: 'rank-badge' }, [String(i + 1)])]),
        el('td', { class: 'agency-name' }, [s.agency]),
        el('td', { class: 'num' }, [num(s.registrations)]),
        el('td', { class: 'num' }, [num(s.surveyResponses)]),
        el('td', { class: 'num' }, [num(s.seminarApplications)]),
        el('td', { class: 'num' }, [num(s.purchases)]),
      ]);
    });
    var thead = el('thead', null, [el('tr', null, [
      el('th', null, ['順位']), el('th', null, ['名前']),
      el('th', null, ['登録数']), el('th', null, ['アンケート回答']),
      el('th', null, ['セミナー申し込み']), el('th', null, ['購入']),
    ])]);
    return el('div', { class: 'card' }, [
      el('h2', null, ['ランキング（累計）']),
      el('table', null, [thead, el('tbody', null, rows)]),
    ]);
  }

  function renderDaily(daily) {
    var rows = daily
      .filter(function (d) { return d.date; })
      .map(function (d) {
        return el('tr', null, [
          el('td', null, [d.date]),
          el('td', { class: 'agency-name' }, [d.agency]),
          el('td', { class: 'num' }, [num(d.registrations)]),
          el('td', { class: 'num' }, [num(d.surveyResponses)]),
          el('td', { class: 'num' }, [num(d.seminarApplications)]),
          el('td', { class: 'num' }, [num(d.purchases)]),
        ]);
      });
    var thead = el('thead', null, [el('tr', null, [
      el('th', null, ['登録日']), el('th', null, ['名前']),
      el('th', null, ['登録数']), el('th', null, ['アンケート回答']),
      el('th', null, ['セミナー申し込み']), el('th', null, ['購入']),
    ])]);
    return el('div', { class: 'card' }, [
      el('h2', null, ['日別実績']),
      el('table', null, [thead, el('tbody', null, rows)]),
    ]);
  }

  fetch(API_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var content = document.getElementById('content');
      content.innerHTML = '';
      if (data.updatedAt) {
        document.getElementById('updated').textContent = 'データ更新日: ' + data.updatedAt;
      }
      if (!data.summary || data.summary.length === 0) {
        content.appendChild(el('div', { class: 'card' }, [
          el('div', { class: 'empty' }, ['まだ実績データがありません']),
        ]));
        return;
      }
      content.appendChild(renderRanking(data.summary));
      content.appendChild(renderDaily(data.daily || []));
    })
    .catch(function (err) {
      console.error(err);
      document.getElementById('content').innerHTML =
        '<div class="card"><div class="error">データの取得に失敗しました。時間をおいて再度開いてください。</div></div>';
    });
})();
</script>
</body>
</html>
